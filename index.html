<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pelanggan Cameron Highlands</title>
<style>
  :root {
    --blue: #1a237e; --blue-light: #e8eaf6; --blue-mid: #3949ab;
    --purple: #ede7f6; --white: #fff; --gray: #f5f5f5;
    --red: #c62828; --green: #2e7d32; --border: #c5cae9;
    --text: #212121; --text-light: #666;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f2ff; color: var(--text); }

  /* HEADER */
  header {
    background: var(--blue); color: #fff; padding: 14px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px #0003;
  }
  header h1 { font-size: 1.1rem; }
  header span { font-size: 0.8rem; opacity: 0.7; }

  /* TOOLBAR */
  .toolbar {
    background: #fff; padding: 12px 20px; display: flex; flex-wrap: wrap;
    gap: 10px; align-items: center; border-bottom: 2px solid var(--border);
    position: sticky; top: 57px; z-index: 99; box-shadow: 0 1px 4px #0001;
  }
  .toolbar input[type=text] {
    flex: 1; min-width: 180px; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 0.9rem;
  }
  .toolbar select {
    padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 0.9rem; background: #fff;
  }
  .btn {
    padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 0.85rem; font-weight: bold; transition: opacity 0.2s;
  }
  .btn:hover { opacity: 0.85; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-success { background: var(--green); color: #fff; }
  .btn-danger  { background: var(--red); color: #fff; }
  .btn-gray    { background: #e0e0e0; color: var(--text); }

  /* STATS BAR */
  .stats { padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px; }
  .stat-chip {
    background: var(--blue-light); border: 1px solid var(--border);
    border-radius: 20px; padding: 4px 14px; font-size: 0.8rem;
    cursor: pointer; transition: background 0.2s;
    display: flex; align-items: center; gap: 6px;
  }
  .stat-chip:hover, .stat-chip.active { background: var(--blue); color: #fff; }
  .stat-chip .count {
    background: var(--blue); color: #fff; border-radius: 10px;
    padding: 1px 7px; font-size: 0.75rem; font-weight: bold;
  }
  .stat-chip.active .count { background: rgba(255,255,255,0.3); }

  /* TABLE */
  .table-wrap { padding: 0 20px 30px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; background: #fff;
    border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px #0001; }
  thead tr { background: var(--blue); color: #fff; }
  thead th { padding: 11px 10px; text-align: left; font-size: 0.82rem;
    white-space: nowrap; }
  tbody tr { border-bottom: 1px solid #e8eaf6; transition: background 0.15s; }
  tbody tr:hover { background: #f3f4ff !important; }
  tbody td { padding: 10px; font-size: 0.82rem; vertical-align: top; }
  tbody tr.group-even { background: #fff; }
  tbody tr.group-odd  { background: var(--purple); }
  tbody tr.group-first td { border-top: 2px solid var(--blue-mid); }

  .name-cell { font-weight: bold; }
  .phone-cell a { color: var(--blue-mid); text-decoration: none; font-weight: bold; }
  .phone-cell a:hover { text-decoration: underline; }
  .order-cell { font-family: monospace; font-size: 0.8rem; color: var(--text-light); }
  .addr-cell { max-width: 260px; color: var(--text-light); font-size: 0.78rem; line-height: 1.4; }
  .region-badge {
    display: inline-block; padding: 2px 9px; border-radius: 12px;
    font-size: 0.73rem; font-weight: bold; background: var(--blue-light);
    color: var(--blue); white-space: nowrap;
  }
  .action-btn {
    background: none; border: none; cursor: pointer; padding: 4px 7px;
    border-radius: 5px; font-size: 0.8rem; transition: background 0.15s;
  }
  .action-btn:hover { background: #e8eaf6; }
  .multi-badge {
    display: inline-block; background: var(--blue); color: #fff;
    border-radius: 10px; padding: 1px 7px; font-size: 0.7rem;
    margin-left: 4px; vertical-align: middle;
  }

  /* MODAL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: #0006;
    z-index: 200; align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff; border-radius: 12px; padding: 28px;
    width: 95%; max-width: 520px; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 8px 32px #0004;
  }
  .modal h2 { color: var(--blue); margin-bottom: 18px; font-size: 1rem; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.82rem;
    font-weight: bold; margin-bottom: 5px; color: var(--blue); }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 7px; font-size: 0.88rem; font-family: Arial, sans-serif;
  }
  .form-group textarea { resize: vertical; min-height: 70px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  /* EMPTY */
  .empty { text-align: center; padding: 50px; color: var(--text-light); font-size: 0.9rem; }

  /* MOBILE */
  @media (max-width: 600px) {
    .toolbar { top: 50px; }
    .table-wrap { padding: 0 8px 30px; }
    thead th:nth-child(6), tbody td:nth-child(6) { display: none; } /* hide address on mobile */
    .addr-cell { max-width: 120px; }
  }
</style>
</head>
<body>

<header>
  <h1>📋 Pelanggan Cameron Highlands</h1>
  <span id="total-count">0 rekod</span>
</header>

<div class="toolbar">
  <input type="text" id="search" placeholder="🔍  Cari nama / telefon / order no...">
  <select id="region-filter">
    <option value="">Semua Kawasan</option>
    <option>KAMPUNG RAJA</option>
    <option>TRINGKAP</option>
    <option>KEA FARM</option>
    <option>BRINCHANG</option>
    <option>TANAH RATA</option>
    <option>KUALA TERLA</option>
    <option>RINGLET</option>
  </select>
  <button class="btn btn-success" onclick="openAddModal()">＋ Tambah</button>
  <button class="btn btn-gray" onclick="exportCSV()">⬇ Export CSV</button>
</div>

<div class="stats" id="stats-bar"></div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>ORDER NO.</th>
        <th>NAMA</th>
        <th>TELEFON</th>
        <th>KAWASAN</th>
        <th>ALAMAT</th>
        <th>TINDAKAN</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <div class="empty" id="empty-msg" style="display:none">Tiada rekod dijumpai.</div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modal-title">Tambah Pelanggan Baru</h2>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Order No.</label>
      <input type="text" id="f-order" placeholder="cth: 10099449">
    </div>
    <div class="form-group">
      <label>Nama Pelanggan *</label>
      <input type="text" id="f-name" placeholder="Nama penuh">
    </div>
    <div class="form-group">
      <label>Telefon 1</label>
      <input type="tel" id="f-p1" placeholder="0123456789">
    </div>
    <div class="form-group">
      <label>Telefon 2</label>
      <input type="tel" id="f-p2" placeholder="0123456789 (pilihan)">
    </div>
    <div class="form-group">
      <label>Kawasan *</label>
      <select id="f-region">
        <option>KAMPUNG RAJA</option>
        <option>TRINGKAP</option>
        <option>KEA FARM</option>
        <option>BRINCHANG</option>
        <option>TANAH RATA</option>
        <option>KUALA TERLA</option>
        <option>RINGLET</option>
      </select>
    </div>
    <div class="form-group">
      <label>Alamat</label>
      <textarea id="f-addr" placeholder="Alamat penuh"></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-gray" onclick="closeModal()">Batal</button>
      <button class="btn btn-danger" id="delete-btn" onclick="deleteRecord()" style="display:none">Padam</button>
      <button class="btn btn-primary" onclick="saveRecord()">Simpan</button>
    </div>
  </div>
</div>

// ── STATE ────────────────────────────────────────────────────────────────────
const STORE_KEY = 'pelanggan_ch_v1';
let records = [];
let filtered = [];
let currentFilter = '';
let currentSearch = '';

function loadData() {
  const saved = localStorage.getItem(STORE_KEY);
  if (saved) {
    records = JSON.parse(saved);
  } else {
    records = DEFAULT_DATA.map((r,i) => ({...r, id: i+1}));
    saveData();
  }
}
function saveData() {
  localStorage.setItem(STORE_KEY, JSON.stringify(records));
}
function nextId() {
  return records.length ? Math.max(...records.map(r=>r.id)) + 1 : 1;
}

// ── RENDER ───────────────────────────────────────────────────────────────────
const REGIONS = ["KAMPUNG RAJA","TRINGKAP","KEA FARM","BRINCHANG","TANAH RATA","KUALA TERLA","RINGLET"];

function applyFilter() {
  const q = currentSearch.toLowerCase();
  filtered = records.filter(r => {
    const matchRegion = !currentFilter || r.region === currentFilter;
    const matchSearch = !q ||
      r.name.toLowerCase().includes(q) ||
      (r.p1||'').includes(q) ||
      (r.p2||'').includes(q) ||
      (r.order||'').includes(q) ||
      (r.address||'').toLowerCase().includes(q);
    return matchRegion && matchSearch;
  });
  // Sort: by region order, then name, then order
  const regionIdx = r => REGIONS.indexOf(r.region);
  filtered.sort((a,b) => {
    const ri = regionIdx(a) - regionIdx(b);
    if (ri !== 0) return ri;
    const ni = a.name.localeCompare(b.name);
    if (ni !== 0) return ni;
    return (a.order||'').localeCompare(b.order||'');
  });
  renderTable();
  renderStats();
  document.getElementById('total-count').textContent = `${filtered.length} rekod`;
}

function renderStats() {
  const bar = document.getElementById('stats-bar');
  const counts = {};
  records.forEach(r => counts[r.region] = (counts[r.region]||0) + 1);
  bar.innerHTML = `
    <div class="stat-chip ${!currentFilter?'active':''}" onclick="setFilter('')">
      Semua <span class="count">${records.length}</span>
    </div>` +
    REGIONS.map(r => `
    <div class="stat-chip ${currentFilter===r?'active':''}" onclick="setFilter('${r}')">
      ${r} <span class="count">${counts[r]||0}</span>
    </div>`).join('');
}

function setFilter(region) {
  currentFilter = region;
  document.getElementById('region-filter').value = region;
  applyFilter();
}

function renderTable() {
  const tbody = document.getElementById('table-body');
  const empty = document.getElementById('empty-msg');

  if (!filtered.length) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  // Count same-name groups for badge
  const nameCounts = {};
  filtered.forEach(r => nameCounts[r.name] = (nameCounts[r.name]||0) + 1);

  let prevName = null, groupIdx = -1;
  tbody.innerHTML = filtered.map((r, i) => {
    const isFirst = r.name !== prevName;
    if (isFirst) { groupIdx++; prevName = r.name; }
    const groupClass = groupIdx % 2 === 0 ? 'group-even' : 'group-odd';
    const firstClass = isFirst ? ' group-first' : '';
    const badge = (isFirst && nameCounts[r.name] > 1)
      ? `<span class="multi-badge">${nameCounts[r.name]} unit</span>` : '';
    const phone1 = r.p1 ? `<span style="display:inline-flex;align-items:center;gap:5px"><a href="tel:${r.p1}">${r.p1}</a><a href="https://wa.me/6${r.p1.replace(/^0/,'').replace(/\D/g,'')}" target="_blank" title="WhatsApp" style="display:inline-flex;align-items:center;text-decoration:none">` +
      `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>` +
      `</a></span>` : '-';
    const phone2 = r.p2 ? `<br><span style="display:inline-flex;align-items:center;gap:5px"><a href="tel:${r.p2}" style="opacity:0.7">${r.p2}</a><a href="https://wa.me/6${r.p2.replace(/^0/,'').replace(/\D/g,'')}" target="_blank" title="WhatsApp" style="display:inline-flex;align-items:center;text-decoration:none;opacity:0.7">` +
      `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>` +
      `</a></span>` : '';
    return `<tr class="${groupClass}${firstClass}">
      <td style="color:#999;font-size:0.75rem">${i+1}</td>
      <td class="order-cell">${r.order||'-'}</td>
      <td class="name-cell">${r.name}${badge}</td>
      <td class="phone-cell">${phone1}${phone2}</td>
      <td><span class="region-badge">${r.region}</span></td>
      <td class="addr-cell">${r.address||'-'}</td>
      <td>
        <button class="action-btn" title="Edit" onclick="openEditModal(${r.id})">✏️</button>
      </td>
    </tr>`;
  }).join('');
}

// ── MODAL ────────────────────────────────────────────────────────────────────
function openAddModal() {
  document.getElementById('modal-title').textContent = 'Tambah Pelanggan Baru';
  document.getElementById('edit-id').value = '';
  document.getElementById('f-order').value = '';
  document.getElementById('f-name').value = '';
  document.getElementById('f-p1').value = '';
  document.getElementById('f-p2').value = '';
  document.getElementById('f-region').value = currentFilter || 'BRINCHANG';
  document.getElementById('f-addr').value = '';
  document.getElementById('delete-btn').style.display = 'none';
  document.getElementById('modal').classList.add('open');
}

function openEditModal(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  document.getElementById('modal-title').textContent = 'Edit Rekod';
  document.getElementById('edit-id').value = id;
  document.getElementById('f-order').value = r.order||'';
  document.getElementById('f-name').value = r.name;
  document.getElementById('f-p1').value = r.p1||'';
  document.getElementById('f-p2').value = r.p2||'';
  document.getElementById('f-region').value = r.region;
  document.getElementById('f-addr').value = r.address||'';
  document.getElementById('delete-btn').style.display = 'inline-block';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function saveRecord() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { alert('Sila masukkan nama!'); return; }
  const id = document.getElementById('edit-id').value;
  const rec = {
    order: document.getElementById('f-order').value.trim(),
    name: name.toUpperCase(),
    p1: document.getElementById('f-p1').value.trim(),
    p2: document.getElementById('f-p2').value.trim(),
    region: document.getElementById('f-region').value,
    address: document.getElementById('f-addr').value.trim(),
  };
  if (id) {
    const idx = records.findIndex(x => x.id == id);
    records[idx] = { ...records[idx], ...rec };
  } else {
    rec.id = nextId();
    records.push(rec);
  }
  saveData();
  closeModal();
  applyFilter();
}

function deleteRecord() {
  const id = document.getElementById('edit-id').value;
  if (!id) return;
  const r = records.find(x => x.id == id);
  if (!confirm(`Padam rekod "${r.name}"?\nTindakan ini tidak boleh diundur.`)) return;
  records = records.filter(x => x.id != id);
  saveData();
  closeModal();
  applyFilter();
}

// ── EXPORT ───────────────────────────────────────────────────────────────────
function exportCSV() {
  const header = ['Order No','Nama','Telefon 1','Telefon 2','Kawasan','Alamat'];
  const rows = filtered.map(r =>
    [r.order, r.name, r.p1, r.p2, r.region, r.address].map(v => `"${(v||'').replace(/"/g,'""')}"`).join(',')
  );
  const csv = [header.join(','), ...rows].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pelanggan_${currentFilter||'semua'}_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
}

// ── EVENTS ───────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value;
  applyFilter();
});
document.getElementById('region-filter').addEventListener('change', e => {
  currentFilter = e.target.value;
  applyFilter();
});
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// ── INIT ─────────────────────────────────────────────────────────────────────
loadData();
applyFilter();
</script>
